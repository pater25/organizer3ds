<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Diario 3DS">
<meta name="theme-color" content="#F2F2F7">
<title>Diario 3DS</title>
<link rel="stylesheet" href="stile.css">
</head>
<body>

<div id="schermataAccesso">
  <h1 id="titoloAccesso">Diario 3DS</h1>
  <p id="sottotitoloAccesso">Il diario condiviso della classe</p>
  <input class="campo" id="campoNome" type="text" placeholder="Nome e cognome (solo per registrarti)">
  <input class="campo" id="campoEmail" type="email" placeholder="Email">
  <input class="campo" id="campoPassword" type="password" placeholder="Password (minimo 6 caratteri)">
  <button class="bottone principale" id="bottoneAccedi" type="button">Accedi</button>
  <button class="bottone" id="bottoneRegistrati" type="button">Registrati</button>
  <p id="messaggioAccesso"></p>
  <p class="piede">Diario 3DS · creato da Davide Paternoster</p>
</div>

<div id="schermataApp">
  <div id="intestazione">
    <h1 id="titoloVista">Home</h1>
    <span id="saluto"></span>
  </div>

  <div class="vista" id="vistaHome"></div>
  <div class="vista" id="vistaCalendario"></div>
  <div class="vista" id="vistaLista"></div>
  <div class="vista" id="vistaMaterie"></div>
  <div class="vista" id="vistaAdmin"></div>
  <div class="vista" id="vistaIo"></div>

  <p class="piede">Diario 3DS · creato da Davide Paternoster</p>

  <button id="bottoneNuovo" type="button" aria-label="Nuova voce">+</button>

  <div id="barraSchede">
    <button class="scheda attiva" data-vista="home" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Home</span></button>
    <button class="scheda" data-vista="calendario" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><span>Calendario</span></button>
    <button class="scheda" data-vista="lista" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 7h11M9 12h11M9 17h11"/><circle cx="4.5" cy="7" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="17" r="1"/></svg><span>Lista</span></button>
    <button class="scheda" data-vista="materie" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 21V5"/></svg><span>Materie</span></button>
    <button class="scheda" id="schedaAdmin" data-vista="admin" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg><span>Admin</span></button>
    <button class="scheda" data-vista="io" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg><span>Io</span></button>
  </div>
</div>

<div id="finestra">
  <div id="foglio">
    <h2 id="titoloFinestra">Nuova voce</h2>
    <select class="campo" id="sceltaTipo">
      <option value="verifica">Verifica</option>
      <option value="interrogazione">Interrogazione</option>
      <option value="compito">Compito</option>
      <option value="evento">Evento / gita</option>
    </select>
    <select class="campo" id="sceltaMateria"></select>
    <input class="campo" id="campoData" type="date">
    <input class="campo" id="campoTitolo" type="text" placeholder="Titolo" maxlength="100">
    <input class="campo" id="campoArgomenti" type="text" placeholder="Argomenti o capitoli da studiare" maxlength="200">
    <input class="campo" id="campoLink" type="url" placeholder="Link (https://...)" maxlength="300">
    <input class="campo" id="campoNote" type="text" placeholder="Note" maxlength="200">
    <div id="azioniFinestra">
      <button class="bottone" id="bottoneAnnulla" type="button">Annulla</button>
      <button class="bottone principale" id="bottoneSalva" type="button">Salva</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
